name: Build Windows Package

# PyInstaller can't cross-compile - a Windows .exe has to be built on a real
# Windows machine. This runs on GitHub's windows-latest runner so the school
# gets a real, tested package without anyone needing a Windows dev box.
#
# The release is a folder (zipped), not a single .exe: the FastAPI backend
# (PyInstaller onefile) and the Next.js frontend (standalone Node server) are
# two separate processes now, so a portable Node.js runtime and a launcher
# script ship alongside the backend .exe. See packaging/Start-Voting.bat.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Next.js frontend (standalone output)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Assemble standalone frontend (static + public assets)
        working-directory: frontend
        run: |
          Copy-Item -Recurse -Force .next/static .next/standalone/.next/static
          if (Test-Path public) { Copy-Item -Recurse -Force public .next/standalone/public }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Verify ballot data is present
        run: |
          if (-not (Test-Path "ballot.json")) { throw "ballot.json missing - run scripts/extract_symbols.py and commit its output" }
          if (-not (Test-Path "candidates/symbols")) { throw "candidates/symbols missing" }

      - name: Build C-LABS-EVM-Backend.exe
        run: >
          pyinstaller --onefile --name C-LABS-EVM-Backend --console
          --add-data "candidates/symbols;candidates/symbols"
          --add-data "ballot.json;."
          --hidden-import uvicorn.loops.auto
          --hidden-import uvicorn.loops.asyncio
          --hidden-import uvicorn.protocols.http.auto
          --hidden-import uvicorn.protocols.http.h11_impl
          --hidden-import uvicorn.protocols.websockets.auto
          --hidden-import uvicorn.lifespan.on
          --hidden-import uvicorn.lifespan.off
          main.py

      - name: Download portable Node.js runtime (win-x64)
        shell: pwsh
        run: |
          $shasums = (Invoke-WebRequest -UseBasicParsing https://nodejs.org/dist/latest-v20.x/SHASUMS256.txt).Content
          $line = ($shasums -split "`n") | Where-Object { $_ -match 'win-x64\.zip$' } | Select-Object -First 1
          $filename = ($line -split '\s+')[1].Trim()
          Write-Host "Downloading $filename"
          Invoke-WebRequest -UseBasicParsing "https://nodejs.org/dist/latest-v20.x/$filename" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-extracted
          $extractedDir = Get-ChildItem -Path node-extracted -Directory | Select-Object -First 1
          Move-Item $extractedDir.FullName node-runtime

      - name: Assemble release package
        shell: pwsh
        run: |
          $out = "release/C-LABS-EVM"
          New-Item -ItemType Directory -Force -Path "$out/Backend" | Out-Null
          New-Item -ItemType Directory -Force -Path "$out/Frontend" | Out-Null

          Copy-Item "dist/C-LABS-EVM-Backend.exe" "$out/Backend/"
          Copy-Item -Recurse "frontend/.next/standalone/*" "$out/Frontend/"
          Copy-Item -Recurse "node-runtime" "$out/node"
          Copy-Item "packaging/Start-Voting.bat" "$out/"

          Compress-Archive -Path $out -DestinationPath "C-LABS-EVM-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: C-LABS-EVM-windows
          path: C-LABS-EVM-windows.zip
          retention-days: 90

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: C-LABS-EVM-windows.zip
